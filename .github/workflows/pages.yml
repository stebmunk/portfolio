# Deploy the static site at the repository root to GitHub Pages.
# Uses ubuntu-24.04 because the built-in Pages workflow's ubuntu-latest
# jobs were failing to acquire a hosted runner.
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One production deployment at a time. Do not cancel a deploy that is
# already in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # The site lives at the repo root. The action always omits
          # .git and .github. Hidden files are included so .nojekyll
          # is published with the rest of the site.
          path: .
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
